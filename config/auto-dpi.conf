# auto-dpi 配置 —— 屏幕缩放
# 改完直接运行 auto-dpi 生效；想先看会算出什么，跑 auto-dpi --show

# 缩放倍数。留空 = 自动检测。
#   自动检测的逻辑：用显示器 EDID 报告的物理尺寸算出真实 DPI，再除以 96 取整。
#   你这块 27 寸 4K 屏 = 163 DPI → 163/96 ≈ 1.70 → 取整 2。
#   切到 1920x1080 后同一块屏 = 82 DPI → 82/96 ≈ 0.85 → 取整 1（自动回到 1x）。
# 想固定成其它值就写死，例如 SCALE=1.5
SCALE=

# 自动检测的取整方式：nearest（四舍五入，默认）| floor | ceil
#   163/96 = 1.70，nearest→2，floor→1。想更紧凑用 floor。
ROUND=nearest

# 1x 下的光标大小（像素）。实际大小 = 这个值 × 缩放倍数。
CURSOR_SIZE=24

# i3 标题栏 / i3bar 的字体。脚本会把字号 × 缩放倍数写回 ~/.config/i3/config。
# ⚠ i3 用 PangoCairo 渲染，实测【不读】Xft.dpi，所以字号只能在这里按倍数给。
# ⚠ 因此 i3 配置里的 font 那一行由本脚本接管，直接改那边会被下次运行覆盖——
#   要换字体就改这里。
I3_FONT_SPEC="pango:Open Sans, Symbola"   # 字体描述，不含字号
I3_FONT_BASE=8                            # 1x 下的基准字号（4K 下写入 16）

# 各目标的开关。出问题可以单独关掉定位。
DO_GTK=1        # GTK3/4 的 settings.ini
DO_XSETTINGSD=1 # 用 xsettingsd 提供 GTK 窗口缩放。
#   ⚠⚠ 它一旦运行，就是 GTK 主题/字体/光标的【唯一来源】，
#   改 ~/.config/gtk-3.0/settings.ini 会被它压过去、看起来"没生效"。
#   相关设置请改 ~/.config/xsettingsd/xsettingsd.conf。
#   好处是缩放不依赖环境变量，切分辨率时已运行的程序也能实时跟随。
DO_QT=1         # Qt 环境变量（fcitx5 面板、wemeet 等）
DO_CHROMIUM=1   # ~/.config/chromium-flags.conf
DO_FIREFOX=1    # Firefox profile 里的 user.js
DO_ROFI=1       # rofi 的 config.rasi（rofi 2.0 不读 Xft.dpi，只能写文件）
DO_IDEA=0       # IntelliJ：现代版本会自动跟随 GDK_SCALE，一般无需开启
RESTART_FCITX5=1  # 倍数变化时重启 fcitx5（否则输入法候选窗还是旧大小）
