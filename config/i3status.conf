general {
        colors = false
        interval = 5
        output_format = "i3bar"
        markup = pango
}

order += "wireless _first_"
order += "ethernet _first_"
order += "disk /"
order += "cpu_usage"
order += "volume master"
order += "tztime local"

wireless _first_ {
        format_up = "<span background='#68c7c1'>    </span><span background='#dbd9da'>  %essid: %ip  </span>"
        format_down = "<span background='#68c7c1'>    </span><span background='#dbd9da'>  down  </span>"
}

ethernet _first_ {
        format_up = "<span background='#a3be8c'>  LAN  </span><span background='#dbd9da'>  %ip  </span>"
        format_down = "<span background='#a3be8c'>  LAN  </span><span background='#dbd9da'>  down  </span>"
}

disk "/" {
        format = "<span background='#d8af60'>  SSD  </span><span background='#dbd9da'>  %avail  </span>"
}

cpu_usage {
        format = "<span background='#e46c6d'>  CPU  </span><span background='#dbd9da'>  %usage  </span>"
}

volume master {
        format = "<span background='#b899a8'>    </span><span background='#dbd9da'>  %volume  </span>"
        format_muted = "<span background='#b899a8'>    </span><span background='#dbd9da'>  Muted  </span>"
        device = "pulse"
}

tztime local {
        format = "<span background='#81a1c1'>    </span><span background='#dbd9da'>  %Y-%m-%d %H:%M  </span>"
}
